<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Website</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Hello, world! 👋</h1>
    <p>This is my first website. I'm learning HTML, CSS, and git.</p>

    <h2>Things I want to learn</h2>
    <ul>
      <li>HTML – the structure of a page</li>
      <li>CSS – how a page looks</li>
      <li>Git – saving versions of my work</li>
    </ul>

    <button id="greet">Click me</button>
    <p id="message"></p>
  </main>

  <script>
    // A tiny bit of JavaScript: show a message when the button is clicked
    document.getElementById("greet").addEventListener("click", function () {
      document.getElementById("message").textContent = "You clicked the button! 🎉";
    });
  </script>
</body>
</html>
